# ===============================================================================
# 项目信息。
# ===============================================================================
PROJECT: runoff
TYPE: RunoffModel
BRIEF: 降雨产流模型。

# ===============================================================================
# 时间域配置
# ===============================================================================
TEMPORAL:
  start_time: "2025-12-23 00:00:00"
  end_time: "2025-12-24 00:00:00"
  time_step: 3600

# ===============================================================================
# 空间域配置
# ===============================================================================
SPATIAL:
  type: NODE
  load_from: null
  save_to: null
  params:
    x: 0
    y: 0

# ===============================================================================
# 数据集配置
# ===============================================================================
DATAS:
  timeseries:
    - id: rainfall
      expr:
        func: "lambda t: 1.50"
        start: "2025-12-23 00:00:00"
        end: "2025-12-24 00:00:00"
        step: 3600
  tables:
    - id: land_soil
      xs: ["urban", "forest", "farm", "water"]
      ys: ["clay", "silt", "sand"]
      zs: null
      vs: [[0.8, 0.5, 0.3], [0.6, 0.4, 0.2], [0.5, 0.3, 0.2], [0.2, 0.1, 0.05]]
      expr: null
      from: null

# ===============================================================================
# 算子配置
# ===============================================================================
OPERATORS: null

# ===============================================================================
# 求解器配置
# ===============================================================================
SOLVER: null

# ===============================================================================
# 自定义配置
# ===============================================================================
CUSTOMS:
  area_km2: 1.0
  land_type: "urban"
  soil_type: "clay"
