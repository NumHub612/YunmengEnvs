# ===============================================================================
# 项目信息。
# ===============================================================================
PROJECT: river
TYPE: RiverModel
BRIEF: 河道汇流模型。

# ===============================================================================
# 环境配置
# ===============================================================================
ENV: null

# ===============================================================================
# 时间域配置
# ===============================================================================
TEMPORAL:
  start_time: "2025-12-23 00:00:00"
  end_time: "2025-12-24 00:00:00"
  time_step: 3600

# ===============================================================================
# 空间域配置
# ===============================================================================
SPATIAL:
  type: RiverNet
  load_from: null
  save_to: null
  params:
    start_loc: [0, 0]
    end_loc: [100, 100]
    segments: 5
    width: 1
    depth: 1
    slope: 0.01

# ===============================================================================
# 数据集配置
# ===============================================================================
DATAS:
  timeseries:
    - id: inflows
      expr:
        func: "lambda t: 100.0"
        start: "2025-12-23 00:00:00"
        end: "2025-12-24 00:00:00"
        step: 3600
  curves:
    - id: sd_curve
      xs: [0, 100, 200, 300, 400, 500]
      ys: [0, 10, 20, 30, 40, 50]

# ===============================================================================
# 算子配置
# ===============================================================================
OPERATORS: null

# ===============================================================================
# 求解器配置
# ===============================================================================
SOLVER: null

# ===============================================================================
# 自定义配置
# ===============================================================================
CUSTOMS:
  Q0: 0.0
  Z0: 0.0
  ke: 2.0
  xe: 0.2
