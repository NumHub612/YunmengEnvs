# ===============================================================================
# 模型集配置。对应 TestScheduler.test_pull_chain_executes_upstream_first：
# basin.rsv1.Q (PULL) -> down.in.up1，执行顺序 [basin, down]
# ===============================================================================
MODELS:
  - id: "basin"
    description: "Hydrology model (sub1 -> rsv1)"
    from: "./benchmarks/hydro_links/basin.yml"
    # 模型Output交换项
    outputs:
      - id: "rsv1.Q"
        description: "Reservoir outflow"
        quantity:
          id: "FlowRate"
          description: "Discharge"
          variable: "flow"
        position:
          id: "rsv1"
          description: "Reservoir node"
          element: "node"
          ids: ["rsv1"]
      - id: "rsv1.Z"
        description: "Reservoir water level"
        quantity:
          id: "stage"
          description: "Water level"
          variable: "water_level"
        position:
          id: "rsv1"
          description: "Reservoir node"
          element: "node"
          ids: ["rsv1"]
      - id: "sub1.Q"
        description: "Subbasin outflow"
        quantity:
          id: "FlowRate"
          description: "Runoff discharge"
          variable: "runoff"
        position:
          id: "sub1"
          description: "Subbasin node"
          element: "node"
          ids: ["sub1"]
  - id: "down"
    description: "Downstream reservoir model"
    from: "./benchmarks/hydro_links/down.yml"
    # 模型Input交换项
    inputs:
      - id: "in.up1"
        description: "Required upstream inflow"
        quantity:
          id: "FlowRate"
          description: "Inflow discharge"
          variable: "flow"
        position:
          id: "inlet"
          description: "Reservoir inlet"
          element: "node"
          ids: null
  - id: "rsv"
    description: "Reservoir model"
    from: "./benchmarks/hydro_links/rsv.yml"

# ===============================================================================
# 耦合配置。
# ===============================================================================
LINKS:
  # basin → down（对应 test_pull_chain_executes_upstream_first）
  - id: "Basin_to_Down"
    description: "Upstream reservoir outflow into downstream reservoir"
    if_use: True
    mode: "PULL"
    source:
      model: "basin"
      item: "rsv1.Q"
    target:
      model: "down"
      item: "in.up1"

  # 水位 -> 流量端口（对应 test_quantity_mismatch_rejected）：
  # 启用后应在 link 阶段被 Scheduler 拒绝（Quantity mismatch）
  - id: "Level_to_Inflow"
    description: "Negative test: water level into discharge port"
    if_use: False
    mode: "PULL"
    source:
      model: "basin"
      item: "rsv1.Z"
    target:
      model: "down"
      item: "in.up1"

# ===============================================================================
# 调度配置。
# ===============================================================================
SCHEDULES:
  log_freq: 10
  timeout: 300
  verbose: true
  max_steps: 24

# ===============================================================================
# 环境配置
# ===============================================================================
ENVS: null