# ===============================================================================
# 模型集配置。
# ===============================================================================
MODELS:
  - id: "runoff"
    description: "runoff model" # 所有description字段都仅是描述性文字，无功能作用
    from: "./benchmarks/hydro_links/runoff.yml"
    # 模型Output交换项
    outputs:
      - id: "Outflow"
        description: "Catchment outlet outflow"
        # 交换数据定义（指定内置预定义变量，unit随之确定）
        quantity:
          id: "FlowRate"
          description: "Catchment runoff"
          variable: "runoff" # 数据类型
        # 交换位置定义（要求只能选择模型内对象id, geom随之确定）
        position:
          id: "Outlet"
          description: "Catchment outlet"
          element: "outlet" # 对象类型
          ids: null # 交换对象id列表
  - id: "river"
    description: "1D River model"
    from: "./benchmarks/hydro_links/river.yml"
    # 模型Input交换项
    inputs:
      - id: "LateralInflow"
        description: "Lateral inflow from RR"
        quantity:
          id: "FlowRate"
          description: "River flow"
          variable: "flow"
        position:
          id: "cross_section_3"
          description: "Catchment outlet"
          element: "CrossSection"
          ids: ["cross_3"]
    # 模型Output交换项
    outputs:
      - id: "Outflow"
        description: "River outflow"
        # 交换数据定义
        quantity:
          id: "outflow"
          description: "River flow"
          variable: "flow"
        # 交换位置定义
        position:
          id: "downstream"
          description: "River outlet"
          element: "CrossSection"
          ids: ["cross_5"]
      - id: "stage"
        description: "Cross section stage"
        # 交换数据定义
        quantity:
          id: "stage"
          description: "River stage"
          variable: "water_level"
        # 交换位置定义
        position:
          id: "cross_section"
          description: "River cross section"
          element: "CrossSection"
          ids: ["cross_3"]

# ===============================================================================
# 耦合配置。
# ===============================================================================
LINKS:
  # RR → River（水下流）
  - id: "RR_to_River"
    description: "Lateral inflow from RR to River"
    if_use: False
    mode: "PULL"
    source:
      model: "runoff"
      item: "Outflow"
    target:
      model: "river"
      item: "LateralInflow"
    # 可选：时空映射
    data_operations:
      - type: "TemporalInterpolation"
        params:
          mode: "Linear"
      - type: "SpatialMapping"
        params:
          mode: "Nearest"

# ===============================================================================
# 调度配置。
# ===============================================================================
SCHEDULES:
  log_freq: 10
  timeout: 300
  verbose: true
