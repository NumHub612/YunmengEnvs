# ===============================================================================
# 项目信息。对应 TestScheduler 中的下游 ReservoirModel(id="down")，
# 带必需外部入流口 inflows: ["up1"]
# ===============================================================================
PROJECT: down
TYPE: ReservoirModel
BRIEF: 下游水库模型（接收上游 basin 出流）。

# ===============================================================================
# 时间域配置（DT=3600s, STEPS=24）
# ===============================================================================
TEMPORAL:
  start_time: "2025-12-23 00:00:00"
  end_time: "2025-12-24 00:00:00"
  time_step: 3600

# ===============================================================================
# 空间域配置
# ===============================================================================
SPATIAL:
  type: NODE
  load_from: null
  save_to: null
  params:
    x: 0
    y: 0

# ===============================================================================
# 数据集配置
# ===============================================================================
DATAS: null

# ===============================================================================
# 算子配置
# ===============================================================================
OPERATORS: null

# ===============================================================================
# 求解器配置
# ===============================================================================
SOLVER: null

# ===============================================================================
# 自定义配置：reservoir_cfg("x") 的 storage/reservoir 参数 + 必需入流口
# ===============================================================================
CUSTOMS:
  storage:
    curve:
      method: linear       # LinearStorageCurve
      params:
        z0: 100.0
        s0: 5.0e7
        area_km2: 12.0
    s_init: 5.0e7
  reservoir:
    algo: target_level     # TargetLevelRelease
    params:
      target_storage: 5.0e7
      q_max: 1.0e6
  inflows:
    - up1                  # 必需入流：未连接时 update() 应返回 FAILED