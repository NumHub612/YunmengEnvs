# ===============================================================================
# 项目信息。对应 test_hydros.basin_model()：HydrologyModel(id="basin")
# ===============================================================================
PROJECT: basin
TYPE: HydrologyModel
BRIEF: 流域水文模型（sub1 产流 -> rsv1 水库）。

# ===============================================================================
# 时间域配置（DT=3600s, STEPS=24）
# ===============================================================================
TEMPORAL:
  start_time: "2025-12-23 00:00:00"
  end_time: "2025-12-24 00:00:00"
  time_step: 3600

# ===============================================================================
# 空间域配置
# ===============================================================================
SPATIAL:
  type: NODE
  load_from: null
  save_to: null
  params:
    x: 0
    y: 0

# ===============================================================================
# 数据集配置：两个常值雨量站（const_series g1=10.0, g2=20.0, n=24, dt=3600）
# ===============================================================================
DATAS:
  timeseries:
    - id: g1
      xs: [0, 3600, 7200, 10800, 14400, 18000, 21600, 25200, 28800, 32400,
           36000, 39600, 43200, 46800, 50400, 54000, 57600, 61200, 64800,
           68400, 72000, 75600, 79200, 82800]
      ys: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0,
           10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0,
           10.0, 10.0, 10.0, 10.0]
    - id: g2
      xs: [0, 3600, 7200, 10800, 14400, 18000, 21600, 25200, 28800, 32400,
           36000, 39600, 43200, 46800, 50400, 54000, 57600, 61200, 64800,
           68400, 72000, 75600, 79200, 82800]
      ys: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0,
           20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0,
           20.0, 20.0, 20.0, 20.0]

# ===============================================================================
# 算子配置
# ===============================================================================
OPERATORS: null

# ===============================================================================
# 求解器配置
# ===============================================================================
SOLVER: null

# ===============================================================================
# 自定义配置：节点拓扑与算法参数（对应 nodes/edges/expose）
# ===============================================================================
CUSTOMS:
  nodes:
    # subbasin_cfg(name="sub1", area=100.0, forcing={P:{g1:.5,g2:.5}, E:"g1"})
    - name: sub1
      type: subbasin
      area: 100.0
      forcing:
        P:
          g1: 0.5
          g2: 0.5
        E: g1
      runoff:
        algo: xaj        # XinanjiangRunoff 默认参数
        params: {}
      surface:
        algo: linear3    # ThreeSourceLinearReservoir 默认参数
        params: {}
    # reservoir_cfg(name="rsv1", target=5.0e7)
    - name: rsv1
      type: reservoir
      storage:
        curve:
          method: linear # LinearStorageCurve
          params:
            z0: 100.0
            s0: 5.0e7
            area_km2: 12.0
        s_init: 5.0e7
      reservoir:
        algo: target_level   # TargetLevelRelease
        params:
          target_storage: 5.0e7
          q_max: 1.0e6
  edges:
    - [sub1, rsv1]
  expose:
    - sub1.Q
    - rsv1.Q
    - rsv1.Z
    - rsv1.S