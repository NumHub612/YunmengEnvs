# ===============================================================================
# 项目信息。对应 TestReservoirModel 的独立水库场景 ReservoirModel(id="rsv")，
# 可选入流口 inflows: [{"name": "up1", "required": False}]
# ===============================================================================
PROJECT: rsv
TYPE: ReservoirModel
BRIEF: 独立水库模型（可选入流，未连接也可运行）。

# ===============================================================================
# 时间域配置（steps=4：4 小时）
# ===============================================================================
TEMPORAL:
  start_time: "2025-12-23 00:00:00"
  end_time: "2025-12-23 04:00:00"
  time_step: 3600

# ===============================================================================
# 空间域配置
# ===============================================================================
SPATIAL:
  type: NODE
  load_from: null
  save_to: null
  params:
    x: 0
    y: 0

# ===============================================================================
# 数据集配置
# ===============================================================================
DATAS: null

# ===============================================================================
# 算子配置
# ===============================================================================
OPERATORS: null

# ===============================================================================
# 求解器配置
# ===============================================================================
SOLVER: null

# ===============================================================================
# 自定义配置
# ===============================================================================
CUSTOMS:
  storage:
    curve:
      method: linear
      params:
        z0: 100.0
        s0: 5.0e7
        area_km2: 12.0
    s_init: 5.0e7
  reservoir:
    algo: target_level
    params:
      target_storage: 5.0e7
      q_max: 1.0e6
  inflows:
    - name: up1
      required: false      # 可选入流：无入流时库容回落至目标值