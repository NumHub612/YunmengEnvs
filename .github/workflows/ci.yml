name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ['3.12']

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.41.0
          cache: true
          environments: test

      - uses: pyvista/setup-headless-display-action@v3

      - name: Run tests with coverage
        run: |
          pixi run --environment test pytest -v --cov=yunmeng --cov-report=xml --cov-report=term
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build docs
        if: ${{ matrix.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main' }}
        run: |
          cp README.md docs/README.md
          pixi run --environment docs mkdocs build --site-dir site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy docs to GitHub Pages
        if: ${{ matrix.os == 'ubuntu-22.04' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          enable_jekyll: false

      - name: Build package
        if: ${{ matrix.os == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags') }}
        run: |
          pixi run --environment default python -m build

      # - name: Upload to PyPI
      #   if: ${{ matrix.os == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags') }}
      #   env:
      #     TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
      #     TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      #   run: pixi run --environment default twine upload dist/*
